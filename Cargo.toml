[package]
name         = "havok_classes_hk2014"
description  = "Havok generated classes(ver. hk_2014.1.0-r1: Fallout4). Generated by `class_generator` of serde-hkx."
version      = "0.1.0"
authors      = ["SARDONYX"]
edition      = "2024"
license      = "MIT OR Apache-2.0"
rust-version = "1.89"
publish      = false

# Independent from the workspace of serde-hkx.
[workspace]

[dependencies]
bitflags   = "2.13.2" # To generate flags type
educe      = { version = "0.8.2", features = ["full"] } # To support the `Default` trait implementation for huge fixed-size arrays.
num-derive = "0.5.1" # To serialize Enum & Flags
num-traits = "0.2.19" # To serialize Enum & Flags
schemars   = { version = "1.2.3", features = ["indexmap2"], optional = true }
serde      = { version = "1.0.229", features = ["derive"], optional = true } # Implement (De)Serializer
serde_with = { version = "3.24.0", default-features = false, features = ["alloc", "macros"], optional = true }

# serde-hkx crates
#
# NOTE: These must be the same crates as serde-hkx's. Otherwise traits are different types.
#       So serde-hkx side `[patch]`es this git url to its path crates.
havok_serde        = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx" }
havok_types        = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx" }
havok_types_derive = { git = "https://github.com/SARDONYX-forks/d-merge-serde-hkx" }

[features]
# Derive `serde`
serde = ["havok_types/serde", "bitflags/serde", "dep:serde", "dep:serde_with"]

# Enable serde values to fall-back to default ones even if class fields don't have the `SERIALIZED_IGNORED` flag.
serde_default = ["serde"]

# Strictly check for the presence of values.
strict = []

# When reading partial XML in Nemesis, you may want to ignore duplicates because the original comes a second time.
ignore_duplicates = []

# Derive json schema generator
json_schema = ["serde", "havok_types/json_schema", "dep:schemars"]
